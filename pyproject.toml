[project]
name = "genpark-quantum-grover-search-oracle-amplifier-skill"
version = "1.0.0"
description = "Grover's quantum search amplitude amplification engine demonstrating quadratic speedup for unstructured database queries via phase inversion oracles."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
